[project]
name = "paper-screener-core"
version = "0.2.0"
description = "Keyword/score screening helpers for research papers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]
[project.optional-dependencies]
dev = ["pytest>=7.4"]
[project.urls]
Source = "https://github.com/MichaelSwann2x/paper-screener-core"
Original = "https://github.com/mirkovicdev/paper_screener"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/paper_screener_core"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
